[package]
name = "weld-float"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
weld-window-config = { path = "../weld-window-config", features = ["ecs"] }
weld-input-config = { path = "../weld-input-config", features = ["ecs"] }
bevy.workspace = true
weld-app = { path = "../weld-app" }
weld-window = { path = "../weld-window" }

[dev-dependencies]
weld-input = { path = "../weld-input", features = ["bevy"] }
weld-app = { path = "../weld-app", features = ["test-support"] }

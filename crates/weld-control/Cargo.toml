[package]
name = "weld-control"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
weld-access = { path = "../weld-access" }
weld-agent = { path = "../weld-agent" }
anyhow.workspace = true
clap.workspace = true
qrcode = { version = "0.14.1", default-features = false }
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json = "1"
schemars = "1"
server-less = { git = "https://github.com/rhi-zone/server-less", rev = "885c740e772edf98719cccf74fe5867b3fbcbb63", default-features = false, features = ["jsonrpc", "cli", "jsonschema", "mcp"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
xdg = "3.0.0"
weld-hoist-iroh = { path = "../weld-hoist-iroh" }
weld-diagnostics = { path = "../weld-diagnostics" }

[[bin]]
name = "weldctl"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
weld-media = { path = "../weld-media" }

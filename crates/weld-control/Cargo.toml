[package]
name = "weld-control"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
weld-hoist-core.workspace = true
weld-hoist-protocol.workspace = true
weld-access.workspace = true
weld-accessibility.workspace = true
weld-remote-control.workspace = true
anyhow.workspace = true
clap.workspace = true
qrcode = { version = "0.14.1", default-features = false }
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json = "1"
schemars = "1"
base64 = "0.22"
tempfile = "3"
tarpc = { version = "0.38", default-features = false, features = ["tokio1", "serde-transport", "unix"] }
tokio-serde = { version = "0.9", features = ["messagepack"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
futures-lite.workspace = true
server-less = { git = "https://github.com/rhi-zone/server-less", rev = "885c740e772edf98719cccf74fe5867b3fbcbb63", default-features = false, features = ["jsonrpc", "cli", "jsonschema", "mcp"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
xdg = "3.0.0"
weld-hoist-iroh.workspace = true
weld-diagnostics.workspace = true

[[bin]]
name = "weldctl"
path = "src/main.rs"

[dev-dependencies]
weld-media.workspace = true

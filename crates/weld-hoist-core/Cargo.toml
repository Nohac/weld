[package]
name = "weld-hoist-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["sessions"]
sessions = ["dep:weld-session", "dep:tokio", "dep:getrandom", "dep:postcard", "dep:serde"]

[dependencies]
weld-session = { path = "../weld-session", optional = true }
tokio = { workspace = true, features = ["macros"], optional = true }
weld-media = { path = "../weld-media" }
anyhow.workspace = true
async-channel = "2.5"
async-io = "2.6"
futures-lite.workspace = true
getrandom = { version = "0.3.4", optional = true }
postcard = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
weld-access = { path = "../weld-access" }
tracing.workspace = true
weld-client = { path = "../weld-client" }
weld-diagnostics = { path = "../weld-diagnostics" }
weld-hoist-protocol = { path = "../weld-hoist-protocol" }

[package]
name = "weld-hoist-encoded"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
android = ["dep:weld-media-android", "weld-media/decode"]
native = ["dep:weld-core"]
vaapi = ["native", "dep:weld-media-vaapi", "dep:rustix"]

[dependencies]
weld-diagnostics.workspace = true
anyhow.workspace = true
rustix = { workspace = true, optional = true }
tracing.workspace = true
weld-client.workspace = true
weld-core = { workspace = true, optional = true }
weld-hoist-core.workspace = true
weld-hoist-protocol.workspace = true
weld-media.workspace = true
weld-media-vaapi = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
weld-media-android = { workspace = true, optional = true }

[dev-dependencies]
weld-access.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
weld-audio.workspace = true

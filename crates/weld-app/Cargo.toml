[package]
name = "weld-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = ["weld-core/test-support"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
# Converter functions only. Weld owns the outer event loop.
bevy_winit.workspace = true
leafwing-input-manager = { workspace = true, features = ["keyboard", "mouse", "picking"] }
tracing.workspace = true
weld-core = { path = "../weld-core" }
wgpu = { workspace = true, features = ["naga-ir", "vulkan", "wgsl"] }
winit = { workspace = true, features = ["rwh_06"] }

[dev-dependencies]
weld-core = { path = "../weld-core", features = ["test-support"] }

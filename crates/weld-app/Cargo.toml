[package]
name = "weld-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = ["dep:pollster", "weld-client/test-support", "weld-core/test-support"]

[dependencies]
weld-input-config = { workspace = true, features = ["ecs"] }
weld-output.workspace = true
weld-diagnostics.workspace = true
anyhow.workspace = true
bevy.workspace = true
# Converter functions only. Weld owns the outer event loop.
bevy_winit.workspace = true
leafwing-input-manager = { workspace = true, features = ["keyboard", "mouse", "picking"] }
pollster = { workspace = true, optional = true }
tracing.workspace = true
weld-client.workspace = true
weld-presenter.workspace = true
weld-core.workspace = true
weld-input = { workspace = true, features = ["bevy"] }
wgpu = { workspace = true, features = ["naga-ir", "vulkan", "wgsl"] }
winit = { workspace = true, features = ["rwh_06"] }

[dev-dependencies]
weld-app = { workspace = true, features = ["test-support"] }
weld-core = { workspace = true, features = ["test-support"] }

[[bench]]
name = "input_pipeline"
harness = false
required-features = ["test-support"]

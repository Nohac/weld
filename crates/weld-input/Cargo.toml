[package]
name = "weld-input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
bevy = ["dep:bevy", "dep:bevy_winit", "weld-input-config/ecs"]

[dependencies]
weld-input-config = { path = "../weld-input-config" }
anyhow.workspace = true
bevy = { workspace = true, optional = true }
bevy_winit = { workspace = true, optional = true }
weld-client = { path = "../weld-client" }
winit = { workspace = true, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
xkbcommon = "=0.9.0"

[[test]]
name = "bindings"
required-features = ["bevy"]

[package]
name = "weld-hoist-iroh"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:weld-core", "weld-hoist-encoded/native"]
vaapi = ["native", "weld-hoist-encoded/vaapi"]

[dependencies]
anyhow.workspace = true
futures-lite.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
postcard.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
weld-client = { path = "../weld-client" }
weld-core = { path = "../weld-core", optional = true }
weld-hoist-core = { path = "../weld-hoist-core" }
weld-hoist-encoded = { path = "../weld-hoist-encoded" }
weld-hoist-protocol = { path = "../weld-hoist-protocol" }
weld-media = { path = "../weld-media", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[package]
name = "weld-hoist-iroh"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:weld-core"]

[dependencies]
weld-session.workspace = true
async-channel = "2.5"
weld-access.workspace = true
anyhow.workspace = true
base64 = "0.22.1"
getrandom = "0.3.4"
serde_json = "1"
futures-lite.workspace = true
iroh.workspace = true
iroh-base = "1.1"
n0-watcher = "=1.0.0"
noq-udp = "1.2"
iroh-tickets.workspace = true
postcard.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
zeroize.workspace = true
weld-client.workspace = true
weld-diagnostics.workspace = true
weld-core = { workspace = true, optional = true }
weld-hoist-core.workspace = true
weld-hoist-encoded.workspace = true
weld-hoist-protocol.workspace = true
weld-media = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

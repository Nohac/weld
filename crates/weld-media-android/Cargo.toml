[package]
name = "weld-media-android"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
weld-media = { path = "../weld-media", features = ["config"] }

[target.'cfg(target_os = "android")'.dependencies]
ffmpeg-next.workspace = true
libc.workspace = true
ndk = { version = "=0.9.0", default-features = false, features = ["media", "nativewindow", "api-level-28"] }

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "weld-vr"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "weld_vr"
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.5", features = ["api-4-7"] }
anyhow = "1"
weld-media = { path = "../../../crates/weld-media", features = ["config", "decode"] }
weld-client = { path = "../../../crates/weld-client" }
weld-hoist-encoded = { path = "../../../crates/weld-hoist-encoded" }
weld-hoist-iroh = { path = "../../../crates/weld-hoist-iroh" }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
weld-media-android = { path = "../../../crates/weld-media-android" }

[target.'cfg(target_os = "linux")'.dependencies]
weld-media-vaapi = { path = "../../../crates/weld-media-vaapi" }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

# Keep the Android client build independent of the Linux compositor workspace.
# Reusable Weld crates can still be added as explicit path dependencies.
[workspace]

# Reuse the compositor's libva-header compatibility fixes in this isolated workspace.
[patch.crates-io]
cros-libva = { path = "../../../vendor/cros-libva" }

[profile.dev]
debug = 1
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

plugins { id 'com.android.application' version '8.13.2' }
layout.buildDirectory = file('../../../target/connect/android')
android {
    namespace = 'org.weld.connect'
    compileSdk = 36
    buildToolsVersion = '36.1.0'
    defaultConfig {
        applicationId = 'org.weld.connect'
        minSdk = 28
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        manifest.srcFile '../AndroidManifest.xml'
        java.srcDirs = ['.', '../../android-platform']
        jniLibs.srcDirs = ['../../../target/connect/native']
        assets.srcDirs = ['../../../target/connect/android-assets']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes.debug { signingConfig = null }
    packaging.jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] }
}
dependencyLocking { lockAllConfigurations() }
dependencies { implementation 'com.google.android.gms:play-services-code-scanner:16.1.0' }

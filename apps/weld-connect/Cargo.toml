[package]
name = "weld-connect"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
weld-video-gles = { path = "../../crates/weld-video-gles" }
wgpu_context = "=0.10.0"
anyrender = "=0.14.0"
peniko = "0.6"
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "d1b433edbc13da889228ae4f92908f7c28514019", default-features = false, features = ["custom-widget"] }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "d1b433edbc13da889228ae4f92908f7c28514019", default-features = false, features = ["custom-widget"] }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz", rev = "d1b433edbc13da889228ae4f92908f7c28514019", default-features = false, features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "d1b433edbc13da889228ae4f92908f7c28514019" }
anyhow = "1"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "router", "document", "asset"] }
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "d1b433edbc13da889228ae4f92908f7c28514019", default-features = false, features = ["prelude", "vello-hybrid", "system-fonts"] }
manganis = "=0.7.10"
wgpu = { version = "=30.0.0", default-features = false, features = ["gles", "wgsl"] }
futures-timer = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
weld-client = { path = "../../crates/weld-client" }
weld-hoist-iroh = { path = "../../crates/weld-hoist-iroh" }
weld-hoist-encoded = { path = "../../crates/weld-hoist-encoded" }
weld-media = { path = "../../crates/weld-media" }

[target.'cfg(target_os = "linux")'.dependencies]
directories = "6"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22.4"
log = "0.4"

[patch.crates-io]
cros-libva = { path = "../../vendor/cros-libva" }
anyrender_vello_hybrid = { path = "../../vendor/anyrender-vello-hybrid" }

[profile.dev]
opt-level = 3
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package]
name = "weld-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Android's activity, graphics and native media dependencies build independently
# of the Linux compositor host.
[workspace]

[dependencies]
weld-hoist-protocol = { path = "../../crates/weld-hoist-protocol" }
weld-hoist-core = { path = "../../crates/weld-hoist-core" }
anyhow = "1"
bevy = { version = "=0.20.0", default-features = false, features = [
    "std", "async_executor", "bevy_log", "bevy_winit",
    "scene", "ui_bevy_render", "ui_picking", "bevy_ui_widgets", "default_font",
] }
bevy_render = { version = "=0.20.0", features = ["gles"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["gles"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
weld-diagnostics = { path = "../../crates/weld-diagnostics" }
weld-client = { path = "../../crates/weld-client" }
weld-presenter = { path = "../../crates/weld-presenter" }
weld-hoist-encoded = { path = "../../crates/weld-hoist-encoded", features = ["android"] }
weld-hoist-iroh = { path = "../../crates/weld-hoist-iroh" }
weld-media = { path = "../../crates/weld-media", features = ["decode", "config"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
bevy = { version = "=0.20.0", default-features = false, features = ["android-native-activity"] }
weld-media-android = { path = "../../crates/weld-media-android" }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["wayland"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

# Share the compositor's manual-output, fractional-border and profiling fixes.
[patch.crates-io]
bevy_render = { path = "../../vendor/bevy-render" }
bevy_ui = { path = "../../vendor/bevy-ui" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

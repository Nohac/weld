[package]
name = "iroh-adb-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "=1.1.0"
iroh-dns = "=1.1.0"
n0-watcher = "=1.0.0"
noq-udp = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[lints.rust]
unsafe_code = "forbid"

[workspace]
members = [
  "apps/weldwm",
  "crates/weldwm-config",
  "crates/weld-config",
  "crates/weld-ssd-config",
  "crates/weld-window-config",
  "crates/weld-input-config",
  "crates/weld-tile-config",
  "crates/weld-audio",
  "crates/weld-svg",
  "crates/weld-session",
  "crates/weld-accessibility",
  "crates/weld-access",
  "crates/weld-remote-control",
  "crates/weld-recording",
  "crates/weld-remote-control-ui",
  "crates/weld-diagnostics",
  "crates/weld-app",
  "crates/weld-client",
  "crates/weld-core",
  "crates/weld-control",
  "crates/weld-float",
  "crates/weld-gamepad",
  "crates/weld-input",
  "crates/weld-output",
  "crates/weld-presenter",
  "crates/weld-i3-quirks",
  "crates/weld-hoist",
  "crates/weld-hoist-core",
  "crates/weld-hoist-encoded",
  "crates/weld-hoist-iroh",
  "crates/weld-hoist-local",
  "crates/weld-hoist-protocol",
  "crates/weld-hoist-ui",
  "crates/weld-media",
  "crates/weld-media-android",
  "crates/weld-media-vaapi",
  "crates/weld-vaapi",
  "crates/weld-ssd",
  "crates/weld-sway-config",
  "crates/weld-sway-ipc",
  "crates/weld-tile",
  "crates/weld-tile-ui",
  "crates/weld-window",
  "crates/weld-window-ui",
]
exclude = ["vendor/smithay", "vendor/smithay/smithay-drm-extras"]
default-members = ["apps/weldwm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Paths are shared; each consumer selects its own features and optionality.
weld-access = { path = "crates/weld-access" }
weld-accessibility = { path = "crates/weld-accessibility" }
weld-app = { path = "crates/weld-app" }
weld-audio = { path = "crates/weld-audio" }
weld-client = { path = "crates/weld-client" }
weld-config = { path = "crates/weld-config" }
weld-control = { path = "crates/weld-control" }
weld-core = { path = "crates/weld-core" }
weld-diagnostics = { path = "crates/weld-diagnostics" }
weld-float = { path = "crates/weld-float" }
weld-gamepad = { path = "crates/weld-gamepad" }
weld-hoist = { path = "crates/weld-hoist" }
weld-hoist-core = { path = "crates/weld-hoist-core" }
weld-hoist-encoded = { path = "crates/weld-hoist-encoded" }
weld-hoist-iroh = { path = "crates/weld-hoist-iroh" }
weld-hoist-local = { path = "crates/weld-hoist-local" }
weld-hoist-protocol = { path = "crates/weld-hoist-protocol" }
weld-hoist-ui = { path = "crates/weld-hoist-ui" }
weld-i3-quirks = { path = "crates/weld-i3-quirks" }
weld-input = { path = "crates/weld-input" }
weld-input-config = { path = "crates/weld-input-config" }
weld-media = { path = "crates/weld-media" }
weld-media-android = { path = "crates/weld-media-android" }
weld-media-vaapi = { path = "crates/weld-media-vaapi" }
weld-output = { path = "crates/weld-output" }
weld-presenter = { path = "crates/weld-presenter" }
weld-recording = { path = "crates/weld-recording" }
weld-remote-control = { path = "crates/weld-remote-control" }
weld-remote-control-ui = { path = "crates/weld-remote-control-ui" }
weld-session = { path = "crates/weld-session" }
weld-ssd = { path = "crates/weld-ssd" }
weld-ssd-config = { path = "crates/weld-ssd-config" }
weld-svg = { path = "crates/weld-svg" }
weld-sway-config = { path = "crates/weld-sway-config" }
weld-sway-ipc = { path = "crates/weld-sway-ipc" }
weld-tile = { path = "crates/weld-tile" }
weld-tile-config = { path = "crates/weld-tile-config" }
weld-tile-ui = { path = "crates/weld-tile-ui" }
weld-vaapi = { path = "crates/weld-vaapi" }
weld-window = { path = "crates/weld-window" }
weld-window-config = { path = "crates/weld-window-config" }
weld-window-ui = { path = "crates/weld-window-ui" }
weldwm-config = { path = "crates/weldwm-config" }

zeroize = "1"
anyhow = "1.0.100"
ash = "0.38.0"
bevy = { version = "=0.20.0", default-features = false, features = [
  "bevy_remote",
  "bevy_log",
  "bevy_ui_widgets",
  "scene",
  "std",
  "system_font_discovery",
  "ui_bevy_render",
  "ui_picking",
] }
bevy_app = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_asset = { version = "=0.20.0", default-features = false }
bevy_image = { version = "=0.20.0", default-features = false }
bevy_render = { version = "=0.20.0", default-features = false }
bevy_ui_render = { version = "=0.20.0", default-features = false }
bevy_winit = { version = "=0.20.0", default-features = false }
calloop = { version = "0.14.4", features = ["signals"] }
clap = { version = "4.5", features = ["derive"] }
cursor-icon = "1.2.0"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format"] }
futures-lite = "2.6.1"
leafwing-input-manager = { version = "0.22.0", default-features = false }
input = { version = "0.10.0", features = ["libinput_1_26"] }
insta = { version = "1.48.0", default-features = false }
indoc = "2.0.7"
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-tickets = "=1.0.0"
libc = "0.2.177"
png = "0.18.1"
pollster = "0.4.0"
regex = "1.13.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rustix = { version = "1.1.4", features = ["event", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
smithay = { path = "vendor/smithay", default-features = false }
smithay-drm-extras = { path = "vendor/smithay/smithay-drm-extras", default-features = false, features = ["display-info"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-tracy = "0.12.0"
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "io-util", "time", "net"] }
wgpu = { version = "30", default-features = false }
winit = { version = "0.30.13", default-features = false }
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }
x11-dl = "2.21.0"
xcursor = "0.3.11"

# Keep Weld's code quick to rebuild while giving Bevy, Smithay, wgpu, and other
# dependencies enough optimization for a usable compositor development build.
[profile.dev]
opt-level = 1
debug = 2
# Direct DRM surface creation and presenter workers contain Rust panics at
# explicit unwind boundaries. Keep that contract visible in every used profile.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
panic = "unwind"

# Whole-process sampling profile: release codegen with full DWARF information
# for perf call-chain and inline-frame symbolization.
[profile.perf]
inherits = "release"
debug = 2
strip = "none"

[patch.crates-io]
bevy_render = { path = "vendor/bevy-render" }
bevy_ui = { path = "vendor/bevy-ui" }

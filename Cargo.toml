[package]
name = "weldwm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[workspace]
members = ["crates/weld-app", "crates/weld-core", "crates/weld-window"]
exclude = ["vendor/smithay", "vendor/smithay/smithay-drm-extras"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
ash = "0.38.0"
bevy = { version = "=0.19.1", default-features = false, features = [
  "bevy_remote",
  "scene",
  "std",
  "system_font_discovery",
  "ui_bevy_render",
  "ui_picking",
] }
bevy_dylib = "=0.19.1"
bevy_winit = { version = "=0.19.1", default-features = false }
calloop = { version = "0.14.4", features = ["signals"] }
clap = { version = "4.5", features = ["derive"] }
leafwing-input-manager = { version = "0.21.0", default-features = false }
png = "0.18.1"
pollster = "0.4.0"
smithay = { path = "vendor/smithay", default-features = false }
smithay-drm-extras = { path = "vendor/smithay/smithay-drm-extras", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wgpu = { version = "30", default-features = false }
winit = { version = "0.30.13", default-features = false }
x11-dl = "2.21.0"

[dependencies]
anyhow.workspace = true
bevy.workspace = true
bevy_dylib.workspace = true
clap.workspace = true
weld-app = { path = "crates/weld-app" }
weld-core = { path = "crates/weld-core" }
weld-window = { path = "crates/weld-window" }
tracing.workspace = true
tracing-subscriber.workspace = true

# Keep Weld's code quick to rebuild while giving Bevy, Smithay, wgpu, and other
# dependencies enough optimization for a usable compositor development build.
[profile.dev]
opt-level = 1
# Direct DRM surface creation and presenter workers contain Rust panics at
# explicit unwind boundaries. Keep that contract visible in every used profile.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "unwind"

# Temporary Bevy 0.19 compatibility layer. Remove this entire section when
# Weld adopts a Bevy release that natively depends on wgpu 30 or newer.
[patch.crates-io]
bevy_camera = { path = "vendor/bevy-wgpu30/bevy_camera" }
bevy_color = { path = "vendor/bevy-wgpu30/bevy_color" }
bevy_image = { path = "vendor/bevy-wgpu30/bevy_image" }
bevy_light = { path = "vendor/bevy-wgpu30/bevy_light" }
bevy_material = { path = "vendor/bevy-wgpu30/bevy_material" }
bevy_mesh = { path = "vendor/bevy-wgpu30/bevy_mesh" }
bevy_pbr = { path = "vendor/bevy-wgpu30/bevy_pbr" }
bevy_reflect = { path = "vendor/bevy-wgpu30/bevy_reflect" }
bevy_render = { path = "vendor/bevy-wgpu30/bevy_render" }
bevy_shader = { path = "vendor/bevy-wgpu30/bevy_shader" }
bevy_sprite = { path = "vendor/bevy-wgpu30/bevy_sprite" }
bevy_text = { path = "vendor/bevy-wgpu30/bevy_text" }

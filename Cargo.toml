[package]
name = "weldwm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
ash = "0.38.0"
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_remote",
    "scene",
    "std",
    "ui_bevy_render",
    "ui_picking",
] }
bevy_dylib = "0.19.0"
# Converter functions only. Do not enable Bevy's `bevy_winit` facade feature or
# add WinitPlugin: Weld owns the outer event loop.
bevy_winit = { version = "0.19.0", default-features = false }
calloop = { version = "0.14.4", features = ["signals"] }
clap = { version = "4.5", features = ["derive"] }
leafwing-input-manager = { version = "0.21.0", default-features = false, features = [
    "keyboard",
    "mouse",
    "picking",
] }
png = "0.18.1"
pollster = "0.4.0"
smithay = { path = "vendor/smithay", default-features = false, features = [
    "backend_drm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "wayland_frontend",
] }
smithay-drm-extras = { path = "vendor/smithay/smithay-drm-extras", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wayland-sys = { version = "0.31.11", features = ["client", "dlopen"] }
wgpu = { version = "29.0.3", default-features = false, features = [
    "naga-ir",
    "vulkan",
    "wgsl",
] }
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
    "x11",
] }
x11-dl = "2.21.0"

# Keep Weld's code quick to rebuild while giving Bevy, Smithay, wgpu, and other
# dependencies enough optimization for a usable compositor development build.
[profile.dev]
opt-level = 1
# Direct DRM surface creation and presenter workers contain Rust panics at
# explicit unwind boundaries. Keep that contract visible in every used profile.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "unwind"
